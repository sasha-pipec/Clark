{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <link rel="stylesheet" href="{% static 'css/auth_style.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth_page">
    <a href="{% url 'main' %}">
        <div class="auth_page_header">
            <div class="auth_page_header_logo">
                <img class="auth_page_header_logo_img" src="{% static 'images/main_header_logo.png' %}" alt="">
                <p class="auth_page_header_logo_text">Clark</p>
            </div>
        </div>
    </a>
    <div class="auth_page_content">
        <div class="auth_page_content_left">
            <img class="auth_page_content_left_image" src="{% static 'images/auth_page_lock.png' %}" alt="">
        </div>
        <div class="auth_page_content_right">
            <form class="auth_page_content_right_form" action="{% url 'users_auth' %}" method="post">
                {% csrf_token %}
                <div class="auth_page_content_right_form_container">
                    <div class="auth_page_content_right_form_container_inner">
                        <div class="auth_page_content_right_form_title">
                            <h1 class="auth_page_content_right_form_title_text">
                                Войдите, чтобы начать работать
                            </h1>
                        </div>
                        <div class="auth_page_content_right_form_inputs">
                            <div class="auth_page_content_right_form_inputs_item">
                                <div class="auth_page_content_right_form_inputs_item_label">
                                    <p class="auth_page_content_right_form_inputs_item_label_text">
                                        Эл. почта:
                                    </p>
                                </div>
                                <div class="auth_page_content_right_form_inputs_item_input">
                                    <input class="auth_page_content_right_form_inputs_item_input_inner" type="email" name="email">
                                </div>
                            </div>
                            <div class="auth_page_content_right_form_inputs_item">
                                <div class="auth_page_content_right_form_inputs_item_label">
                                    <p class="auth_page_content_right_form_inputs_item_label_text">
                                        Пароль:
                                    </p>
                                </div>
                                <div class="auth_page_content_right_form_inputs_item_input">
                                    <input class="auth_page_content_right_form_inputs_item_input_inner" type="password" name="password">
                                </div>
                            </div>
                            <div class="auth_page_content_right_form_inputs_item">
                                <div class="auth_page_content_right_form_inputs_item_input">
                                    <button type="submit" class="auth_page_content_right_form_btn_auth">Войти</button>
                                </div>
                                <div class="auth_page_content_right_form_inputs_item_input" id="auth_page_content_right_form_inputs_item_lines">
                                    <div class="line_left">
                                        <hr class="line_br">
                                    </div>
                                    <div class="word">
                                        <p class="word_text">ИЛИ</p>
                                    </div>
                                    <div class="line_right">
                                        <hr class="line_br">
                                    </div>
                                </div>
                                <div class="auth_page_content_right_form_inputs_item_input">
                                    <p>{{error}}</p>
                                    <div class="auth_page_content_right_form_inputs_item_input_link"
                                         id="auth_page_content_right_form_inputs_item_input_link_register">
                                        <a href="{% url 'register' %}" class="auth_page_content_right_form_btn_register">Зарегистрироваться</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
